name: API documentation report
description: Report incorrect or missing API documentation.
title: "[API docs] "
labels:
  - documentation
body:
  - type: input
    id: api
    attributes:
      label: API
      description: Name the affected API.
      placeholder: Stripe
    validations:
      required: true
  - type: input
    id: action
    attributes:
      label: Action
      description: Name the affected action, if applicable.
      placeholder: Create Invoice
  - type: input
    id: file
    attributes:
      label: Reference URL
      description: Link to the affected file in this repository.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What is incorrect or missing?
      description: Quote or summarize the current reference.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it say?
      description: Describe the expected API behavior or documentation.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Vendor documentation
      description: Link to the vendor source that supports the correction.
  - type: checkboxes
    id: security
    attributes:
      label: Public report
      options:
        - label: This report does not contain secrets or private data.
          required: true
